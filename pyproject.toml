[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniff-sight"
version = "0.1.0"
description = "Low-cost 2.4 GHz spectrum + IEEE 802.15.4/Thread packet analyzer with a correlated web dashboard"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
  "pyserial>=3.5",
  "pyserial-asyncio>=0.6",
  "numpy>=1.24",
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
sniff-sight = "sniff_sight.__main__:main"

[tool.setuptools]
packages = ["sniff_sight"]

[tool.setuptools.package-data]
sniff_sight = ["firmware/*", "firmware/*/*", "static/*", "demo/*"]
